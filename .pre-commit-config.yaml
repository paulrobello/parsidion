default_stages: [pre-commit, pre-push]
default_language_version:
    python: python3.13
fail_fast: false
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
        # ENH-011: skip the generated API-reference tree so minified/generated
        # content can't trip a false positive.
        exclude: ^docs/api/
      - id: end-of-file-fixer
        # ENH-011: docs/api/ is a generated snapshot (pdoc/typedoc HTML) whose
        # bytes must match `make docs-api` byte-for-byte; these mutators would
        # rewrite trailing whitespace / final newlines and break the drift gate.
        exclude: ^docs/api/
      - id: mixed-line-ending
        exclude: ^docs/api/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^docs/api/
      - id: check-docstring-first
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
        exclude: ^docs/api/
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: make
        language: system
        pass_filenames: false
        # ARC-014: pyright on the full repo (~400 files) is too slow for a
        # per-commit gate. Confine it to pre-push so commits stay fast and
        # the type-check still runs before code leaves the machine. The
        # fast gates (ruff format/check, gitleaks, merge-conflict, ...) keep
        # running at pre-commit via ``default_stages``.
        stages: [pre-push]
        args:
          [typecheck]
      - id: format
        name: format
        entry: make
        language: system
        pass_filenames: false
        args:
          [fmt]
      - id: lint
        name: lint
        entry: make
        language: system
        pass_filenames: false
        args:
          [lint]
