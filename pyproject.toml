[project]
name = "parsidion"
version = "0.15.0"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
search = [
    "fastembed>=0.8.0,<1.0",
    "sqlite-vec>=0.1.9,<1.0",
    "pillow>=12.3.0",
]
tools = [
    "parsidion[search]",
    "rich>=15.0.0",
]
eval = [
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
    "fastembed>=0.8.0,<1.0",
    "sqlite-vec>=0.1.9,<1.0",
    "pillow>=12.3.0",
]

[project.scripts]
vault-search = "vault_search:main"
vault-new = "vault_new:main"
vault-stats = "vault_stats:main"
vault-review = "vault_review:main"
vault-export = "vault_export:main"
vault-merge = "vault_merge:main"
vault-conflicts = "vault_conflicts:main"

[build-system]
requires = [
    "setuptools>=70",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "vault_search",
    "parmem_backend",
    "vault_tui",
    "vault_common",
    "vault_metrics",
    "vault_new",
    "vault_stats",
    "vault_links",
    "vault_review",
    "vault_export",
    "vault_merge",
    "vault_conflicts",
    # ARC-001: modules imported by vault_common / vault_merge / vault_conflicts.
    # Without these, a non-editable wheel install fails on first import.
    "vault_config",
    "vault_path",
    "vault_fs",
    "vault_index",
    "vault_hooks",
    "vault_adaptive",
    "ai_backend",
    # ENH-003: imported unconditionally by vault_search; must ship or a clean
    # wheel install fails on `import vault_search`.
    "vault_embed_serve",
    # ARC-004: these are now stdlib-only re-export shims over core/; they must
    # ship so a clean wheel install can import them (subproc_util is imported by
    # ai_backend/parmem_backend; vault_constants by vault_fs/vault_hooks).
    "subproc_util",
    "vault_constants",
]

# Subpackages under skills/parsidion/scripts/ — declared explicitly so a wheel
# build ships them (the flat top-level modules remain in py-modules above).
# ARC-004: core/ is the stdlib-only library package; doctor/ and summarizer/
# pre-date it (ARC-008/009).
packages = [
    "core",
    "doctor",
    "summarizer",
]

[tool.setuptools.package-dir]
"" = "skills/parsidion/scripts"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-v --cov=skills/parsidion/scripts --cov-report=term-missing"
timeout = 10

[tool.ruff]
target-version = "py313"
exclude = ["parsidion-mcp"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "B",
    "BLE",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "B904",
]

[tool.pyright]
extraPaths = [
    "skills/parsidion/scripts",
    "tools",
    "tools/eval",
]
exclude = [
    "parsidion-mcp",
    ".worktrees",
    ".claude",
    ".venv",
    "skills/parsidion/scripts/build_graph.py",
]

[tool.ty.environment]
extra-paths = [
    "skills/parsidion/scripts",
    "tools/eval",
]

[tool.uv]
constraint-dependencies = [
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
    "pyright>=1.1.411",
    "rich>=15.0.0",
]
