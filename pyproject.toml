[project]
name = "parsidion"
version = "0.20.0"
# ARC-009: raised back from >=3.11 (ARC-013's headroom experiment). CI
# (.github/workflows/ci.yml), parsidion-mcp, and README/CONTRIBUTING/
# ARCHITECTURE all already assume 3.13 and nothing tests 3.11; the root
# floor was the only outlier, so the floor now matches reality.
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
search = [
    "fastembed>=0.8.0,<1.0",
    "sqlite-vec>=0.1.9,<1.0",
    "pillow>=12.3.0",
]
tools = [
    "parsidion[search]",
    "rich>=15.0.0",
]
eval = [
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
    "fastembed>=0.8.0,<1.0",
    "sqlite-vec>=0.1.9,<1.0",
    "pillow>=12.3.0",
]
# ENH-011: build-only API-reference generator. Declared as an extra so it stays
# out of `dependencies = []` (the stdlib-only runtime constraint is sacred) and
# is never pulled in by `make install` or `uv sync --group dev`. Materialized
# on demand by the Makefile via `uv run --extra docs`.
docs = [
    "pdoc>=14.0.0",
]

[project.scripts]
vault-search = "vault_search:main"
vault-new = "vault_new:main"
vault-stats = "vault_stats:main"
vault-review = "vault_review:main"
vault-export = "vault_export:main"
vault-merge = "vault_merge:main"
vault-conflicts = "vault_conflicts:main"

[build-system]
requires = [
    "setuptools>=70",
]
build-backend = "setuptools.build_meta"

# ARC-003: every flat module under skills/parsidion/scripts/ ships. The list is
# enforced against the directory by tests/test_packaging_manifest.py, so adding
# a module without declaring it fails the gate instead of shipping a wheel whose
# console scripts die on first import. (html-to-md.py is excluded: its hyphenated
# filename is not importable as a module.)
[tool.setuptools]
py-modules = [
    "agent_adapter",
    "ai_backend",
    "build_embeddings",
    "build_graph",
    "check_graph_coverage",
    "codex_session_start_hook",
    "codex_stop_hook",
    "codex_subagent_stop_hook",
    "gemini_session_end_hook",
    "gemini_session_start_hook",
    "note_schema",
    "parsight_backend",
    "post_compact_hook",
    "pre_compact_hook",
    "prompt_templates",
    "run_trigger_eval",
    "session_start_hook",
    "session_stop_hook",
    "subagent_stop_hook",
    "subproc_util",
    "summarize_sessions",
    "update_index",
    "vault_adaptive",
    "vault_common",
    "vault_config",
    "vault_conflicts",
    "vault_constants",
    "vault_doctor",
    "vault_embed_serve",
    "vault_export",
    "vault_fs",
    "vault_health",
    "vault_hooks",
    "vault_index",
    "vault_links",
    "vault_merge",
    "vault_metrics",
    "vault_new",
    "vault_path",
    "vault_resolve",
    "vault_review",
    "vault_search",
    "vault_stats",
    "vault_tui",
]

# Subpackages under skills/parsidion/scripts/ — discovered by find so a new
# package (or subpackage) ships without a manifest edit; the include patterns
# are enforced against the directory by tests/test_packaging_manifest.py.
# core/ is the stdlib-only library package (ARC-004); cli/ is the decomposed
# CLI layer (ARC-005); doctor/ and summarizer/ pre-date core/.
[tool.setuptools.packages.find]
where = ["skills/parsidion/scripts"]
include = ["core*", "cli*", "doctor*", "summarizer*", "session_start*"]

[tool.setuptools.package-dir]
"" = "skills/parsidion/scripts"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-v --cov=skills/parsidion/scripts --cov-report=term-missing"
timeout = 10

[tool.ruff]
# Keep ruff's target aligned with requires-python (ARC-009: >=3.13) so the
# lint gate catches syntax that would not run on the declared minimum.
target-version = "py313"
# extend-exclude (not exclude) preserves ruff's defaults (.git, .venv, __pycache__, …);
# *.md opts out of ruff 0.16+'s new Python-in-Markdown formatting so docs stay as authored.
extend-exclude = ["parsidion-mcp", "*.md"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "B",
    "BLE",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# QA-019: the ARC-005/ARC-006 flat compatibility shims exist to re-export
# names for tests, parsidion-mcp, and the installer — every F401 there is
# deliberate, so the exemption lives here instead of on each line.
"skills/parsidion/scripts/vault_common.py" = ["F401"]
"skills/parsidion/scripts/vault_doctor.py" = ["F401", "E402"]
"skills/parsidion/scripts/update_index.py" = ["F401", "E402"]
"skills/parsidion/scripts/vault_merge.py" = ["F401"]
"skills/parsidion/scripts/vault_stats.py" = ["F401"]
"skills/parsidion/scripts/summarize_sessions.py" = ["F401", "E402"]
"skills/parsidion/scripts/session_start_hook.py" = ["F401"]
"skills/parsidion/scripts/ai_backend.py" = ["F401"]
"skills/parsidion/scripts/parsight_backend.py" = ["F401"]
"skills/parsidion/scripts/subproc_util.py" = ["F401"]
"skills/parsidion/scripts/vault_config.py" = ["F401"]
"skills/parsidion/scripts/vault_constants.py" = ["F401"]
"skills/parsidion/scripts/vault_adaptive.py" = ["F401"]
"skills/parsidion/scripts/vault_hooks.py" = ["F401"]
"skills/parsidion/scripts/vault_fs.py" = ["F401"]
"skills/parsidion/scripts/vault_health.py" = ["F401"]
"skills/parsidion/scripts/vault_links.py" = ["F401"]
"skills/parsidion/scripts/vault_index.py" = ["F401"]
"skills/parsidion/scripts/vault_path.py" = ["F401"]
"skills/parsidion/scripts/vault_metrics.py" = ["F401"]
# tools/eval: the sys.path bootstrap must precede the imports it enables.
"tools/eval/*.py" = ["E402"]

[tool.pyright]
extraPaths = [
    "skills/parsidion/scripts",
    "tools",
    "tools/eval",
]
exclude = [
    "parsidion-mcp",
    ".worktrees",
    ".claude",
    ".venv",
]

[tool.ty.environment]
extra-paths = [
    "skills/parsidion/scripts",
    "tools/eval",
]

[tool.uv]
constraint-dependencies = [
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "pyright>=1.1.411",
    "rich>=15.0.0",
]
