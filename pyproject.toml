[project]
name = "parsidion"
version = "0.29.0"
# ARC-009: raised back from >=3.11 (ARC-013's headroom experiment). CI
# (.github/workflows/ci.yml), parsidion-mcp, and README/CONTRIBUTING/
# ARCHITECTURE all already assume 3.13 and nothing tests 3.11; the root
# floor was the only outlier, so the floor now matches reality.
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
search = [
    "fastembed>=0.9.1,<1.0",
    "sqlite-vec>=0.1.9,<1.0",
    "pillow>=13.0.0",
]
tools = [
    "parsidion[search]",
    "rich>=15.0.0",
]
eval = [
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
    "fastembed>=0.9.1,<1.0",
    "sqlite-vec>=0.1.9,<1.0",
    "pillow>=13.0.0",
]
# ENH-011: build-only API-reference generator. Declared as an extra so it stays
# out of `dependencies = []` (the stdlib-only runtime constraint is sacred) and
# is never pulled in by `make install` or `uv sync --group dev`. Materialized
# on demand by the Makefile via `uv run --extra docs`.
docs = [
    "pdoc>=16.0.0",
]

[project.scripts]
vault-search = "parsidion.vault_search:main"
vault-new = "parsidion.vault_new:main"
vault-stats = "parsidion.vault_stats:main"
vault-review = "parsidion.vault_review:main"
vault-export = "parsidion.vault_export:main"
vault-merge = "parsidion.vault_merge:main"
vault-conflicts = "parsidion.vault_conflicts:main"
vault-supersede = "parsidion.vault_supersede:main"

[build-system]
requires = [
    "setuptools>=70",
]
build-backend = "setuptools.build_meta"

# ARC-201: the wheel ships ONLY the parsidion.* namespace. The by-path entry
# scripts that remain at the scripts/ root (hooks, update_index, build_graph,
# vault_doctor, ...) are NOT shipped: they are invoked by file path from hook
# registrations and Makefile targets against a repo/symlink install, never
# imported from an installed wheel, and several carry test monkeypatch surfaces
# that depend on their root module names. (html-to-md.py is additionally
# excluded from import-surface checks: its hyphenated filename is not
# importable as a module.)
[tool.setuptools.packages.find]
where = ["skills/parsidion/scripts"]
include = ["parsidion*"]

[tool.setuptools.package-dir]
"" = "skills/parsidion/scripts"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-v --cov=skills/parsidion/scripts --cov-report=term-missing"
timeout = 10

[tool.ruff]
# Keep ruff's target aligned with requires-python (ARC-009: >=3.13) so the
# lint gate catches syntax that would not run on the declared minimum.
target-version = "py313"
# extend-exclude (not exclude) preserves ruff's defaults (.git, .venv, __pycache__, …);
# *.md opts out of ruff 0.16+'s new Python-in-Markdown formatting so docs stay as authored.
extend-exclude = ["parsidion-mcp", "*.md"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "B",
    "BLE",
    "UP",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# QA-019: the root entry scripts re-export stdlib names and module bindings
# for test monkeypatch surfaces — every F401 there is deliberate, so the
# exemption lives here instead of on each line. (The ARC-005/ARC-006
# compatibility-shim exemptions died with the shims in ARC-200 step 2.)
"skills/parsidion/scripts/vault_doctor.py" = ["F401", "E402"]
"skills/parsidion/scripts/update_index.py" = ["F401", "E402"]
"skills/parsidion/scripts/parsidion/vault_merge.py" = ["F401"]
"skills/parsidion/scripts/parsidion/vault_stats.py" = ["F401"]
"skills/parsidion/scripts/summarize_sessions.py" = ["F401", "E402"]
"skills/parsidion/scripts/session_start_hook.py" = ["F401"]
# tools/eval: the sys.path bootstrap must precede the imports it enables.
"tools/eval/*.py" = ["E402"]

[tool.pyright]
extraPaths = [
    "skills/parsidion/scripts",
    "tools",
    "tools/eval",
]
exclude = [
    "parsidion-mcp",
    ".worktrees",
    ".claude",
    ".venv",
]

[tool.ty.environment]
extra-paths = [
    "skills/parsidion/scripts",
    "tools/eval",
]

[tool.uv]
constraint-dependencies = [
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "pyright>=1.1.414",
    "rich>=15.0.0",
]
