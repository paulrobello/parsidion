# Parsidion Vault Configuration
#
# Place at ~/ParsidionVault/config.yaml
# Values here override script defaults. CLI arguments override these values.
# Precedence: defaults → config.yaml → config.local.yaml → CLI args
#
# config.local.yaml (same directory, always gitignored) is an optional overlay
# merged over this file section-by-section, local values winning on conflict.
# Use it to keep secrets or machine-specific overrides out of config.yaml.

# Session start hook (session_start_hook.py)
session_start_hook:
  ai_model: null           # Model for AI note selection (null = disabled)
  ai_cooldown_seconds: 30  # Skip nested claude -p if AI SessionStart ran recently for this vault
  ai_single_flight: true   # Allow only one nested claude -p SessionStart selector per vault at a time
  max_chars: 4000          # Max context injection characters
  ai_timeout: 25           # AI call timeout in seconds
  recent_days: 3           # Days to look back for recent notes
  debug: false             # Append injected context to debug log in system temp dir
  verbose_mode: false      # If true, inject full note summaries instead of the default compact one-line-per-note index
  use_embeddings: true     # Blend semantic matches into context; graceful fallback if db absent
  track_delta: true        # Show "Since last session" delta for new/updated notes (#10)
  graph_expand: true       # Add 1-hop wikilink neighbours of selected notes (Tier 1 graph retrieval)
  graph_expand_max: 8      # Max neighbour notes added per session (best-connected first)
  graph_rerank: true       # Re-rank notes by seed-cluster tag overlap + hubness (Tier 2 graph retrieval)

# Session stop hook (session_stop_hook.py)
session_stop_hook:
  ai_model: null           # Model for AI classification (null = disabled)
  ai_timeout: 25           # AI call timeout in seconds
  auto_summarize: true     # Auto-launch summarizer when pending entries exist
  auto_summarize_after: 1  # Queue threshold to trigger auto-summarizer (0 = always, 1 = default)
  transcript_tail_lines: 200      # Lines to inspect by default
  pi_transcript_tail_lines: 1000  # Deeper fallback tail for pi transcripts when no assistant text is found

# Subagent stop hook (subagent_stop_hook.py)
subagent_stop_hook:
  enabled: true            # Set false to disable subagent transcript capture entirely
  min_messages: 3          # Minimum assistant message count (pi transcripts default to 1 when unset)
  # Agent types to skip — these run constantly as vault system internals.
  # Value is a comma-separated string (config parser limitation).
  excluded_agents: "vault-explorer,research-agent"

# Pre-compact hook (pre_compact_hook.py)
pre_compact_hook:
  lines: 200               # Transcript lines to analyse

# Session summarizer (summarize_sessions.py)
summarizer:
  model: claude-sonnet-4-6
  max_parallel: 5          # Concurrent summarization tasks
  transcript_tail_lines: 400
  transcript_tail_bytes: 262144  # Byte ceiling on the raw tail; bounds huge-line transcripts (e.g. codex subagent rollouts) so cleaning/chunking cannot explode
  max_cleaned_chars: 12000
  ai_timeout: 120          # Per-summarizer-prompt timeout in seconds (null = backend default)
  persist: false           # SDK session persistence (for debugging)
  cluster_model: claude-haiku-4-5-20251001  # Model for hierarchical chunk summarization; used when a transcript exceeds max_cleaned_chars
  dedup_threshold: 0.80                    # Cosine similarity threshold for near-duplicate detection (0.0-1.0); set to 1.0 to disable
  dead_letter_retention_days: 7            # Prune dead_letters.jsonl entries older than N days each run (write-gate skips are sticky, so the file grows without this); <=0 disables
  rebuild_graph: false                     # Rebuild visualizer graph.json after indexing (same as --rebuild-graph CLI flag)
  graph_include_daily: false               # Include Daily notes in graph rebuild (same as --graph-include-daily CLI flag)
  graph_incremental: false                 # ENH-002: reuse previous graph.json and recompute only changed notes (same as --graph-incremental). Falls back to a full rebuild if the previous graph is missing/unreadable or was built under different parameters.

# AI backend selection (ai_backend.py). Chooses which prompt backend the
# hooks and the summarizer use for AI calls. Default ``auto`` picks the
# first available backend: claude-cli on a Claude Code machine, codex-cli
# where ``codex`` is on PATH. ``none`` disables AI features entirely.
ai:
  backend: auto            # auto | claude-cli | codex-cli | none

# Per-backend model configuration. Each backend has a ``small`` and
# ``large`` tier: hooks use ``small`` (haiku-equivalent) for fast
# classification; the summarizer uses ``large`` (sonnet-equivalent) for
# note generation. Values are passed verbatim to the backend CLI.
ai_models:
  claude:
    small: claude-haiku-4-5-20251001
    large: claude-sonnet-4-6
  codex:
    small: gpt-5.5
    large: gpt-5.5

# Codex CLI invocation (ai_backend.py). Only used when ``ai.backend`` is
# ``codex-cli`` (or ``auto`` resolves to it). ``command`` defaults to the
# first of ``codex`` on PATH; setting it to an absolute path bypasses the
# PATH lookup. ``sandbox`` mirrors codex's own ``--sandbox`` flag and is
# passed verbatim; ``danger-full-access`` requires an explicit opt-in
# (SEC-117).
codex_cli:
  command: codex           # PATH lookup or absolute path to the codex CLI
  timeout: 60              # Per-prompt timeout in seconds
  sandbox: read-only       # read-only | workspace-write | danger-full-access
  ephemeral: false         # Start each prompt with no session state
  skip_git_repo_check: false
  suppress_notify: false
  # allow_danger_full_access: true   # SEC-117: required to actually use sandbox: danger-full-access

# Embeddings / semantic search (build_embeddings.py, vault_search.py)
embeddings:
  enabled: true                   # Set false to disable all embedding builds, note_index writes, and auto-rebuild after update_index.py runs
  model: BAAI/bge-small-en-v1.5  # ~67 MB ONNX model, cached after first run
  min_score: 0.45                 # Minimum cosine similarity for search results (embeddings backend only; par-mem results gate by rank/top_k)
  top_k: 10                       # Default result count for vault_search.py
  decay_enabled: true             # Apply temporal decay so newer notes score higher
  decay_half_life_days: 90        # Days for score to decay halfway to decay_min_factor
  decay_min_factor: 0.5           # Floor multiplier for very old notes (0.0–1.0); prevents scores from vanishing
  service_enabled: false          # ENH-003: opt-in persistent embedding service (vault_embed_serve.py). When true
                                  # AND search.backend is not par-mem, vault_search shares one warm model across
                                  # processes via a local Unix socket instead of each caller loading its own ~67 MB
                                  # ONNX. Off by default; never used while par-mem serves retrieval.
  service_idle_exit: 600          # Seconds the service stays alive with no requests before idle-exiting (default 600)

# par-mem code-memory backend (optional external CLI + always-on daemon).
# When installed and healthy, vault semantic search is served by par-mem's
# hybrid BM25+vector+graph retrieval; the local embeddings pipeline remains
# the always-on silent fallback. See docs/PAR-MEM.md.
par_mem:
  enabled: true            # Probe for par-mem when available; false = never probe
  binary: par-mem          # PATH lookup or absolute path to the par-mem CLI
  timeout_s: 10            # Per-query subprocess timeout in seconds

# Vault search backend selection (vault_search.py)
search:
  backend: auto            # auto | par-mem | embeddings | none
  use_note_index: true     # ENH-004: read note metadata from note_index DB instead of walking the vault.
                           # Set false to force filesystem walks everywhere (escape hatch if you suspect
                           # index staleness). Index builders (update_index.py, build_embeddings.py) always walk.

# Git integration
git:
  auto_commit: true        # Auto-commit vault changes after writes

# Anthropic-compatible transport/env settings (optional)
# These keys mirror real env var names so you can copy values directly from
# env-based configs such as ~/.claude/glm-settings.json.
# Precedence: real environment variable > this config section.
# SECURITY: if you put a real API key or auth token here, this file must NOT
# be committed to the vault git repo. The installer gitignores config.yaml and
# auto-commits exclude it, but if your vault predates that, verify with:
#   git -C <vault> ls-files config.yaml   (output means it is tracked — run
#   git -C <vault> rm --cached config.yaml to untrack it)
# Prefer to git-sync a secret-free config.yaml? Move this anthropic_env
# section (or just the secret keys within it) into config.local.yaml instead
# -- it is always gitignored and is deep-merged over config.yaml at load
# time, so the rest of your config can stay tracked in git.
#
# SEC-103: defaults below route to the real Anthropic endpoint with Anthropic
# model IDs (null = the API's own default for that tier). To route traffic
# through a gateway instead, uncomment the Example block and adjust. Never
# commit a real API key.
anthropic_env:
  ANTHROPIC_API_KEY: null
  ANTHROPIC_AUTH_TOKEN: null
  ANTHROPIC_BASE_URL: null
  ANTHROPIC_CUSTOM_HEADERS: null
  ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5-20251001
  ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-4-6
  ANTHROPIC_DEFAULT_OPUS_MODEL: null
  API_TIMEOUT_MS: 3000000
  HTTPS_PROXY: null
  HTTP_PROXY: null
# Example: routing through a gateway (e.g. Z.ai / GLM). Uncomment and adjust
# to send traffic to a third-party Anthropic-compatible endpoint. Be aware
# that doing so routes full nightly summarization transcripts — including
# source code and file contents — to that endpoint with whatever credential
# is configured, so use it only with endpoints you trust.
# anthropic_env:
#   ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
#   ANTHROPIC_DEFAULT_HAIKU_MODEL: GLM-5-TURBO
#   ANTHROPIC_DEFAULT_SONNET_MODEL: GLM-5.1
#   ANTHROPIC_DEFAULT_OPUS_MODEL: GLM-5.1

# Default model ID — override once here instead of editing each script.
# Note: only ``haiku_model`` is read from this section. Per-tier overrides
# for any backend live in ``ai_models.<backend>`` above (DOC-010).
defaults:
  haiku_model: claude-haiku-4-5-20251001   # Used by session hooks, vault_doctor repair

# Hook event log (session_start_hook.py, session_stop_hook.py, subagent_stop_hook.py)
event_log:
  enabled: true            # Write structured JSON events to hook_events.log (#1)
  max_lines: 10000         # Rotate (keep second half) when the log exceeds this many lines
  path: null               # Absolute path override (null = <vault>/hook_events.log)

# Adaptive context tracking (#17) — derank notes never referenced by Claude
adaptive_context:
  enabled: false           # Track per-note usefulness; derank unreferenced notes over time
  decay_days: 30           # Days without reference before score decays

# Vault identity — used for per-user daily note filenames (team vault sharing)
vault:
  username: ""             # Username suffix for daily notes (DD-{username}.md). Defaults to $USER if blank.
