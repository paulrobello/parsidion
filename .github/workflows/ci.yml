name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  root-checks:
    name: Root — format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SEC-028)

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1 (SEC-028)
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run pyright .

      - name: Parity fixtures check
        # ENH-005: fail if graph.schema.json or vault-resolution.json drifted
        # from build_graph.py / the shared vector contract.
        run: make parity-fixtures-check

      - name: Config docs check
        # ENH-017: fail if the CLAUDE.md config table, the ARCHITECTURE.md
        # reference block, or templates/config.yaml drifted from
        # core/vault_schema.py.
        run: make config-docs-check

      - name: Test
        run: uv run pytest tests/

  graph-tests:
    name: Root — build_graph parsight tests (numpy-gated)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SEC-028)

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1 (SEC-028)
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Test graph (parsight body-link enrichment)
        run: uv run --with numpy pytest tests/test_build_graph_parsight.py

  search-tests:
    name: Root — search-extra suites (sqlite_vec-gated)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SEC-028)

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1 (SEC-028)
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Test search (decay contract + vec0 ANN parity/fallback)
        run: make test-search

  mcp-checks:
    name: parsidion-mcp — format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: parsidion-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SEC-028)

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1 (SEC-028)
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run pyright .

      - name: Test
        run: uv run pytest tests/

  wheel-install:
    name: Wheel build + clean-room import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SEC-028)

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1 (SEC-028)
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Build wheel
        run: uv build

      - name: Install into clean venv and import
        # ARC-003: import every [project.scripts] target and every shipped
        # module/package (derived from pyproject.toml + the scripts directory,
        # so new modules are covered automatically). anyio is installed for the
        # summarizer submodules (a PEP-723 dep of the summarize_sessions entry
        # script); build_embeddings/build_graph are skipped (search-extra
        # fastembed/numpy imports at module scope).
        run: |
          uv venv --python 3.13 --seed /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet --force-reinstall dist/*.whl anyio
          /tmp/wheeltest/bin/python - <<'PYEOF'
          import importlib, pathlib, tomllib

          cfg = tomllib.load(open("pyproject.toml", "rb"))
          scripts_root = pathlib.Path("skills/parsidion/scripts")
          skip = {"build_embeddings", "build_graph"}

          mods = sorted({t.split(":")[0] for t in cfg["project"]["scripts"].values()})
          mods += sorted(m for m in cfg["tool"]["setuptools"]["py-modules"] if m not in skip)
          mods += sorted(
              str(p.with_suffix("")).replace("/", ".")
              for p in scripts_root.rglob("*.py")
              if p.parent != scripts_root and "__pycache__" not in p.parts
          )
          for m in sorted(set(mods)):
              importlib.import_module(m)
          print(f"ok: imported {len(set(mods))} shipped modules/packages")
          PYEOF
          rm -rf /tmp/wheeltest

  visualizer-checks:
    name: visualizer — typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: visualizer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SEC-028)

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (SEC-028)

      - name: Install uv
        # ENH-009: resolveVault delegates to vault_resolve.py via
        # `uv run --no-project`, so route tests that resolve a vault (e.g.
        # unknown-vault -> 400) need uv on PATH. Without it the spawn fails
        # (ENOENT: uv) and the route returns 500 instead of 400.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1 (SEC-028)

      - name: Provision Python for the vault resolver
        run: uv python install 3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Parity fixtures check
        # ENH-005: the shared fixture the TS parity test reads must match the
        # Python emitter. The generator is stdlib-only, so the system python3
        # is enough -- no uv/Python toolchain install needed in this job.
        working-directory: ${{ github.workspace }}
        run: python3 scripts/gen_parity_fixtures.py --check

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  pi-extension-checks:
    name: extensions/pi — test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extensions/pi/parsidion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SEC-028)

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (SEC-028)

      - name: Test
        run: bun test

  docs-api-checks:
    name: docs/api — generated reference drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SEC-028)

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (SEC-028)

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1 (SEC-028)

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install visualizer dependencies (typedoc)
        working-directory: visualizer
        run: bun install --frozen-lockfile

      - name: docs/api drift check
        # DOC-003: pdoc (docs extra) + typedoc (visualizer devDeps) regenerate
        # to a temp dir and diff against the committed docs/api snapshot.
        # typedoc.json pins gitRevision: "main" so "Defined in" links stay
        # stable across commits instead of embedding the build's commit SHA.
        run: make docs-api-check
