name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  root-checks:
    name: Root — format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run pyright .

      - name: Parity fixtures check
        # ENH-005: fail if graph.schema.json or vault-resolution.json drifted
        # from build_graph.py / the shared vector contract.
        run: make parity-fixtures-check

      - name: Test
        run: uv run pytest tests/

  graph-tests:
    name: Root — build_graph par-mem tests (numpy-gated)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Test graph (par-mem body-link enrichment)
        run: uv run --with numpy pytest tests/test_build_graph_parmem.py

  mcp-checks:
    name: parsidion-mcp — format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: parsidion-mcp
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run pyright .

      - name: Test
        run: uv run pytest tests/

  wheel-install:
    name: Wheel build + clean-room import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Build wheel
        run: uv build

      - name: Install into clean venv and import
        run: |
          uv venv --python 3.13 --seed /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet --force-reinstall dist/*.whl
          /tmp/wheeltest/bin/python -c "import vault_common, vault_config, vault_path, vault_search, vault_links, ai_backend, core.vault_config, core.vault_fs, core.subproc_util, doctor, summarizer; print('ok')"
          rm -rf /tmp/wheeltest

  visualizer-checks:
    name: visualizer — typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: visualizer
    steps:
      - uses: actions/checkout@v5

      - name: Install bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install uv
        # ENH-009: resolveVault delegates to vault_resolve.py via
        # `uv run --no-project`, so route tests that resolve a vault (e.g.
        # unknown-vault -> 400) need uv on PATH. Without it the spawn fails
        # (ENOENT: uv) and the route returns 500 instead of 400.
        uses: astral-sh/setup-uv@v5

      - name: Provision Python for the vault resolver
        run: uv python install 3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Parity fixtures check
        # ENH-005: the shared fixture the TS parity test reads must match the
        # Python emitter. The generator is stdlib-only, so the system python3
        # is enough -- no uv/Python toolchain install needed in this job.
        working-directory: ${{ github.workspace }}
        run: python3 scripts/gen_parity_fixtures.py --check

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  pi-extension-checks:
    name: extensions/pi — test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extensions/pi/parsidion
    steps:
      - uses: actions/checkout@v5

      - name: Install bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Test
        run: bun test parsidion-status.test.ts
